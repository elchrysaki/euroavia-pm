<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Wingman</title>
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#2b4f92"/>
      <stop offset=".55" stop-color="#142c5e"/>
      <stop offset="1" stop-color="#081634"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6ea"/>
      <stop offset="1" stop-color="#3a4a66"/>
    </linearGradient>
    <!-- brushed silver -->
    <linearGradient id="silver" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#c3cddb"/>
      <stop offset=".45" stop-color="#f2f5fa"/>
      <stop offset=".62" stop-color="#8e9bb0"/>
      <stop offset=".82" stop-color="#dfe5ee"/>
      <stop offset="1" stop-color="#9aa7bb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5d6b82"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ecf5"/>
      <stop offset="1" stop-color="#9fb0c8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9bff"/>
      <stop offset="1" stop-color="#1747b8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6b82"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5d6b82"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feFlood flood-color="#9cc2ff" flood-opacity=".55"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feOffset in="SourceAlpha" dx="3" dy="6" result="o"/>
      <feGaussianBlur in="o" stdDeviation="4" result="s"/>
      <feFlood flood-color="#020a1c" flood-opacity=".6"/>
      <feComposite in2="s" operator="in" result="sh"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- navy tile -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="url(#rim)"/>
  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#bg)"/>

  <!-- emblem: wings + E with a calendar in its opening; drawn upright, then slanted -->
  <g transform="translate(103 6) skewX(-18.6)" stroke-linejoin="round" filter="url(#glow)">
    <g fill="url(#silver)" stroke="url(#edge)" stroke-width="4">
      <!-- tapering speed-line wings -->
      <path d="M14 150 H198 V180 H40 Z"/>
      <path d="M58 198 H198 V226 H78 Z"/>
      <path d="M102 244 H194 V270 H118 Z"/>
      <!-- the E (top bar, spine, bottom bar) -->
      <path d="M214 150 H404 V188 H252 V302 H376 V340 H214 Z"/>
    </g>

    <!-- calendar sitting where the E's middle bar would be -->
    <rect x="266" y="206" width="124" height="86" rx="12" fill="#0d2350" stroke="url(#silver)" stroke-width="6"/>
    <path d="M266 220a12 12 0 0 1 12-12h100a12 12 0 0 1 12 12v8H266z" fill="url(#silver)"/>
    <rect x="292" y="192" width="10" height="28" rx="5" fill="url(#ring)" stroke="#3a4a66" stroke-width="2"/>
    <rect x="354" y="192" width="10" height="28" rx="5" fill="url(#ring)" stroke="#3a4a66" stroke-width="2"/>
    <g fill="url(#cell)">
      <rect x="278" y="238" width="21" height="17" rx="4"/>
      <rect x="305" y="238" width="21" height="17" rx="4"/>
      <rect x="332" y="238" width="21" height="17" rx="4"/>
      <rect x="359" y="238" width="21" height="17" rx="4" fill="url(#blue)"/>
      <rect x="278" y="263" width="21" height="17" rx="4"/>
      <rect x="305" y="263" width="21" height="17" rx="4" fill="url(#blue)"/>
      <rect x="332" y="263" width="21" height="17" rx="4"/>
      <rect x="359" y="263" width="21" height="17" rx="4"/>
    </g>
  </g>
</svg>
