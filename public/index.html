<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wingman</title>
  <meta name="description" content="Wingman: find the days for a trip or the hour for a meeting with your group. No logins, just a link or a PIN." />
  <meta name="theme-color" content="#e8f3ff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#050b18" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wingman" />
  <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
  <link rel="alternate icon" href="/icon-192.png?v=2" type="image/png" />
  <link rel="preload" href="/fonts/michroma.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    /* Pick the visual mode before first paint: "full" (glass, long animations) or "lite" (smooth mode).
       Fully automatic — never shown to the user. Order: ?perf= developer override (not stored) >
       this device's last measured result (kept 7 days, then re-measured) > device/network signals. */
    (function () {
      var d = document.documentElement, mode = null, why = "default";
      function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function mq(q) { return window.matchMedia && matchMedia(q).matches; }
      try { localStorage.removeItem("convene:perf"); } catch (e) {} /* retired manual toggle */
      var q = /[?&]perf=(lite|full)\b/.exec(location.search);
      if (q) { mode = q[1]; why = "override"; }
      if (!mode) {
        var rec = null;
        try { rec = JSON.parse(get("convene:perf-auto") || "null"); } catch (e) {}
        if (typeof rec === "number") rec = { mode: "lite", at: rec }; /* older format */
        var fresh = rec && Date.now() - rec.at < 7 * 864e5;
        var c = navigator.connection || {}, mem = navigator.deviceMemory, cores = navigator.hardwareConcurrency;
        var css = window.CSS && CSS.supports;
        if (fresh && rec.mode === "lite") why = "measured";
        else if (mq("(prefers-reduced-motion: reduce)")) why = "reduced-motion";
        else if (mq("(prefers-reduced-transparency: reduce)")) why = "reduced-transparency";
        else if (c.saveData) why = "data-saver";
        else if (/(^|-)2g|3g/.test(c.effectiveType || "")) why = "slow-network";
        else if (fresh && rec.mode === "full") why = "measured-full";
        else if (mem && mem <= 2) why = "low-memory";
        else if (cores && cores <= 2) why = "few-cores";
        else if (mem && mem < 4 && cores && cores <= 4) why = "low-end";
        else if (!css || !(CSS.supports("backdrop-filter", "blur(1px)") || CSS.supports("-webkit-backdrop-filter", "blur(1px)"))) why = "old-browser";
        mode = why === "default" || why === "measured-full" ? "full" : "lite";
      }
      d.setAttribute("data-perf", mode);
      d.setAttribute("data-perf-reason", why);
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=54" />
</head>
<body>
  <!-- the background: one fixed layer that never moves or re-scales, the same on every page -->
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar" id="navbar">
    <a href="/" class="brand" data-link aria-label="Wingman home">
      <span class="wordmark">Wingman</span>
    </a>
    <a class="navlink" href="/dashboard" data-link data-tab="dashboard">Dashboard</a>
    <a class="navlink" href="/join" data-link data-tab="join">Join with PIN</a>
    <span class="grow"></span>
    <div class="nav-actions" id="navActions"></div>
    <button type="button" class="btn btn-primary nav-new" data-new>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>New event</span>
    </button>
    <button type="button" class="menu-btn" aria-label="Menu" aria-haspopup="menu" aria-expanded="false"><i></i><i></i><i></i></button>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js?v=51" type="module"></script>
</body>
</html>
