<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wingman — find the days that work</title>
  <meta name="description" content="Plan a meetup without logins: share a link, everyone marks their days, pick a destination together." />
  <meta name="theme-color" content="#e8f3ff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#050b18" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wingman" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grain"></div>
  </div>

  <header class="navbar" id="navbar">
    <a href="/" class="brand" data-link>
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Wingman</span>
    </a>
    <div class="nav-actions" id="navActions"></div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
