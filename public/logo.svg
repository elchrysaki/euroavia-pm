<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>EUROAVIA PM</title>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset=".22" stop-color="#aeb9c7"/>
      <stop offset=".45" stop-color="#eef2f7"/>
      <stop offset=".62" stop-color="#7d8a9c"/>
      <stop offset=".82" stop-color="#d6dde7"/>
      <stop offset="1" stop-color="#5d6a7c"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#3c4655"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb6ff"/>
      <stop offset=".5" stop-color="#1f5fd6"/>
      <stop offset="1" stop-color="#0b2f80"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d3df"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b5666"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#4b5666"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- brushed-metal tile -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bezel)"/>
  <rect x="20" y="20" width="472" height="472" rx="102" fill="url(#steel)"/>

  <!-- calendar body -->
  <rect x="106" y="124" width="300" height="276" rx="34" fill="#2a3340" opacity=".35" transform="translate(6 10)"/>
  <rect x="106" y="124" width="300" height="276" rx="34" fill="url(#page)" stroke="url(#bezel)" stroke-width="5"/>
  <path d="M106 158a34 34 0 0 1 34-34h232a34 34 0 0 1 34 34v42H106z" fill="url(#blue)"/>
  <text x="256" y="182" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-weight="900" font-size="38" letter-spacing="3" fill="#ffffff">EUROAVIA</text>

  <!-- binder rings -->
  <rect x="168" y="96" width="22" height="58" rx="11" fill="url(#ring)" stroke="#3c4655" stroke-width="3"/>
  <rect x="322" y="96" width="22" height="58" rx="11" fill="url(#ring)" stroke="#3c4655" stroke-width="3"/>

  <!-- day grid -->
  <g fill="#9aa8ba">
    <rect x="136" y="222" width="46" height="34" rx="8"/>
    <rect x="194" y="222" width="46" height="34" rx="8"/>
    <rect x="252" y="222" width="46" height="34" rx="8"/>
    <rect x="310" y="222" width="46" height="34" rx="8"/>
    <rect x="136" y="268" width="46" height="34" rx="8"/>
    <rect x="194" y="268" width="46" height="34" rx="8" fill="url(#blue)"/>
    <rect x="252" y="268" width="46" height="34" rx="8"/>
    <rect x="310" y="268" width="46" height="34" rx="8"/>
    <rect x="136" y="314" width="46" height="34" rx="8"/>
    <rect x="194" y="314" width="46" height="34" rx="8"/>
    <rect x="252" y="314" width="46" height="34" rx="8"/>
  </g>

  <!-- flight path + chrome jet taking off from the calendar -->
  <path d="M160 360 C 240 360, 300 330, 372 268" fill="none" stroke="#1f5fd6"
        stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <g transform="translate(392 250) rotate(-38)">
    <path d="M-58 0 L40 -8 Q62 0 40 8 Z" fill="url(#steel)" stroke="#2a3340" stroke-width="3"/>
    <path d="M-6 -6 L-30 -48 L-14 -48 L22 -6 Z" fill="url(#blue)" stroke="#2a3340" stroke-width="3"/>
    <path d="M-6 6 L-30 48 L-14 48 L22 6 Z" fill="url(#blue)" stroke="#2a3340" stroke-width="3"/>
    <path d="M-52 -2 L-66 -24 L-56 -24 L-38 -2 Z" fill="url(#blue)" stroke="#2a3340" stroke-width="3"/>
    <path d="M-52 2 L-66 24 L-56 24 L-38 2 Z" fill="url(#blue)" stroke="#2a3340" stroke-width="3"/>
  </g>

  <!-- top glare -->
  <path d="M20 122a102 102 0 0 1 102-102h268a102 102 0 0 1 102 102v40C380 120 140 120 20 200z" fill="url(#shine)"/>
</svg>
